name: Android CI

on:
  push:
    branches: [ "main", "principal" ]
  pull_request:
    branches: [ "main", "principal" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout do código
      uses: actions/checkout@v4

    - name: Configurar o Java JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Corrigir mapeamento do Manifesto (scr)
      run: |
        sed -i 's|src/main/AndroidManifest.xml|scr/principal/AndroidManifest.xml|g' build.gradle.kts || true
        sed -i 's|src/main/AndroidManifest.xml|scr/principal/AndroidManifest.xml|g' aplicativo/build.gradle.kts || true

    - name: Executar o Build com Gradle
      uses: gradle/actions/setup-gradle@v4
      with:
        arguments: assembleDebug --no-daemon

    - name: Salvar o APK gerado (Artifact)
      uses: actions/upload-artifact@v4
      with:
        name: meu-app-apk
        path: "**/build/outputs/apk/debug/*.apk"
